# Fly.io is the documented host. Any host that runs a container and gives it a
# volume works the same way; see README.md "Deploy".
app = "mcp-bookmarks"
primary_region = "sjc"

[build]

[env]
  BOOKMARKS_DB = "/data/bookmarks.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "3s"
    method = "GET"
    path = "/health"

[mounts]
  source = "bookmarks_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
