# Fly.io is the documented host. Any host that runs a container and gives it a
# volume works the same way; see README.md "Deploy".
app = "mcp-bookmarks"
primary_region = "sjc"

[build]

[env]
  BOOKMARKS_DB = "/data/bookmarks.db"
  # Tokens are bound to this URL. Set it to where clients will reach the server.
  BOOKMARKS_PUBLIC_URL = "https://mcp-bookmarks.fly.dev"
  # Your authorization server, as it prints its `iss` claim, and where it publishes keys.
  BOOKMARKS_ISSUER = "https://your-idp.example.com/"
  BOOKMARKS_JWKS_URI = "https://your-idp.example.com/.well-known/jwks.json"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "3s"
    method = "GET"
    path = "/health"

[mounts]
  source = "bookmarks_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
