name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --dev
      - run: uv run ruff format --check src/ tests/
      - run: uv run ruff check src/ tests/
      - run: uv run ty check src/
      - run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t mcp-bookmarks .
      - name: Serve from the image and call /health
        run: |
          # The image refuses to start without authentication settings; CI only checks
          # that it serves, so it runs the anonymous development mode.
          docker run -d --rm --name bookmarks -p 8000:8000 -e BOOKMARKS_ALLOW_ANONYMOUS=true mcp-bookmarks
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          docker stop bookmarks
