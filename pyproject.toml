[project]
name = "mcp-bookmarks"
version = "0.1.0"
description = "A bookmarks MCP server on the 2026-07-28 spec: remote, stateless, one lesson per pull request"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "NimbleBrain Inc", email = "hello@nimblebrain.ai" }]
keywords = ["mcp", "model-context-protocol", "fastmcp", "bookmarks", "tutorial"]
dependencies = [
    "fastmcp>=4.1,<5",
    "mcp>=2,<3",
    "pydantic>=2.12",
    "uvicorn>=0.35",
]

[project.urls]
Homepage = "https://github.com/NimbleBrainInc/mcp-bookmarks"
Repository = "https://github.com/NimbleBrainInc/mcp-bookmarks.git"
Issues = "https://github.com/NimbleBrainInc/mcp-bookmarks/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bookmarks"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "jsonschema>=4.23",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.13",
    "ty>=0.0.20",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
